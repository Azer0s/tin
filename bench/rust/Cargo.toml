[package]
name = "bench_rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench_rust"
path = "src/main.rs"

[[bin]]
name = "bench_rust_pipeline"
path = "src/pipeline.rs"

[[bin]]
name = "bench_rust_mpmc"
path = "src/mpmc.rs"

[[bin]]
name = "bench_rust_jitter"
path = "src/jitter.rs"

[[bin]]
name = "bench_rust_pipeline10"
