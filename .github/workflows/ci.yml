name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build, lint, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install clang (required by tin codegen)
        run: sudo apt-get update -qq && sudo apt-get install -y clang valgrind

      - name: Build compiler
        run: go build -o tin .

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          args: --timeout=5m

      - name: Run example tests
        run: ./tin test examples/ -lm

      - name: Run ARC stress tests under valgrind
        run: |
          for f in examples/arc_stress/*.tin; do
            name=$(basename "$f" .tin)
            echo "=== $name ==="
            ./tin build "$f" -o "/tmp/tin_arc_${name}" -lm
            valgrind --error-exitcode=1 --leak-check=full "/tmp/tin_arc_${name}"
          done
