            valgrind --error-exitcode=1 --leak-check=no "/tmp/tin_arc_${name}"
          done

      - name: Run ARC stress tests (fiber) without valgrind
        run: |
          for f in examples/arc_stress/fiber_*.tin; do
            name=$(basename "$f" .tin)
            echo "=== $name ==="
            ./tin build "$f" -o "/tmp/tin_arc_${name}" -lm
